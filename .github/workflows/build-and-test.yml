name: Build and Test

# PR gate: lint/format check, build, and unit tests. Integration tests
# (tests/integration/**) are excluded — they require a live HEVY_API_KEY and
# are exercised locally, not in CI. Upstream's Codecov upload and OpenTelemetry
# export were removed with the fork's npm-publish workflow: they need secrets
# this deployment does not carry and add no value for a self-hosted image build.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ROLLUP_SKIP_NODEJS_NATIVE_BUILD: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Check
        run: npm run check

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npx vitest run --exclude tests/integration/**
